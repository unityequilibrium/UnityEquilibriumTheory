
name: Nightly Research Audit

on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-research-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Full scheduled research audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/requirements-research.txt
      - name: Compile repository sources
        run: python -m compileall -q core topics docs services_and_experiments
      - name: Run the declared Core and Topic regression inventory
        run: python topics/run_all_tests.py --all
      - name: Upload nightly reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-research-report
          path: |
            .uet-run-reports/**
          if-no-files-found: ignore
