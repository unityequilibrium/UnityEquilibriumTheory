name: Research foundation pilot
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/knowledge_base/**'
      - '.github/workflows/research-foundation-pilot.yml'
permissions:
  contents: read
jobs:
  foundation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.0.2 httpx==0.28.1
      - name: Offline regression tests only
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest docs/knowledge_base/tests -q
