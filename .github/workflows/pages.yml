
name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build public documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare a disposable Pages source
        run: |
          mkdir -p _pages_source
          rsync -a \
            --exclude='**/raw/**' --exclude='**/Raw/**' --exclude='**/1_raw/**' \
            --exclude='**/private/**' --exclude='**/.env*' \
            --exclude='*.sqlite' --exclude='*.sqlite3' --exclude='*.db' \
            --exclude='*.pem' --exclude='*.key' \
            docs/ _pages_source/
          rsync -a \
            --exclude='**/raw/**' --exclude='**/Raw/**' --exclude='**/1_raw/**' \
            --exclude='**/private/**' --exclude='**/.env*' \
            --exclude='*.sqlite' --exclude='*.sqlite3' --exclude='*.db' \
            --exclude='*.pem' --exclude='*.key' \
            core/ _pages_source/core/
          rsync -a \
            --exclude='**/raw/**' --exclude='**/Raw/**' --exclude='**/1_raw/**' \
            --exclude='**/private/**' --exclude='**/.env*' \
            --exclude='*.sqlite' --exclude='*.sqlite3' --exclude='*.db' \
            --exclude='*.pem' --exclude='*.key' \
            topics/ _pages_source/topics/
          python3 docs/scripts/recovery/prepare_pages_math.py _pages_source
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_pages_source
          destination: ./_site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    name: Deploy GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
