[package]
name = "uet_security"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
sha3 = "0.10"
blake3 = "1.5"
pqcrypto-dilithium = "0.5.0"
pqcrypto-traits = "0.3.5"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
rand = "0.8"
zeroize = "1.8.2"
hex = "0.4.3"
chrono = { version = "0.4.38", features = ["serde"] }

[dev-dependencies]
tempfile = "3.27.0"
