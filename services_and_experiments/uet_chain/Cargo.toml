[package]
name = "uet_chain"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
uet_security = { path = "../uet_security" }
hex = "0.4.3"
log = "0.4.29"
bincode = "1.3.3"
sled = "0.34.7"
libp2p = { version = "0.53.2", features = ["tokio", "tcp", "noise", "yamux", "gossipsub", "macros"] }
tokio = { version = "1.0", features = ["sync"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
